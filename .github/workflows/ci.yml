name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The canonical conformance release this SDK is vendored from (ADR-0032).
  BQ_CONFORMANCE_VERSION: "1.6.0"
  # sha256 of that release's fetch.sh: the script runs on the runner, so it is pinned rather than
  # trusted from a mutable tag. Bump together with BQ_CONFORMANCE_VERSION.
  BQ_FETCH_SH_SHA256: 8bb6ba567b288fb0ac71a70fd17041b2503df119e01998d76fdad372570bf849

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests (writes results.json)
        env:
          BQ_CONFORMANCE_RESULTS: ${{ runner.temp }}/results.json
        run: vendor/bin/phpunit --exclude-group integration

      # The runner already fails the run when a bound transport is missing from `bindings` or
      # its sections are missing from the results (ADR-0032 Compliance); this checks the shape.
      - name: Validate results.json against the schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 -I - "$RUNNER_TEMP/results.json" tests/conformance/schema/results.schema.json conformance-known-gaps.json <<'PY'
          import json, re, sys
          import jsonschema
          results = json.load(open(sys.argv[1]))
          jsonschema.validate(results, json.load(open(sys.argv[2])))
          gaps = json.load(open(sys.argv[3]))["gaps"]
          listed = {(g["section"], g["case"]) for g in gaps}
          unreferenced = sorted((g["section"], g["case"]) for g in gaps if not re.search(r"ADR-[0-9]{4}|\.ssot/plans/", g.get("reason", "")))
          status = {(s, c): v["status"] for s, cases in results["sections"].items() for c, v in cases.items()}
          failed = {k for k, v in status.items() if v == "fail"}
          unlisted = sorted(failed - listed)
          stale = sorted(k for k in listed if status.get(k) != "fail")
          for s, c in unreferenced:
              print(f"::error::gap {s}/{c} must reference an ADR-NNNN or a .ssot/plans/ entry in its reason")
          for s, c in unlisted:
              print(f"::error::fail of {s}/{c} is not listed in conformance-known-gaps.json")
          for s, c in stale:
              print(f"::error::stale gap: {s}/{c} is listed in conformance-known-gaps.json but is {status.get((s, c), 'not reported')}; remove the entry")
          print(f"results.json valid; fail = {len(failed)} (known gaps = {len(failed & listed)}, unlisted = {len(unlisted)}, stale = {len(stale)}, unreferenced = {len(unreferenced)})")
          sys.exit(1 if unlisted or stale or unreferenced else 0)
          PY

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  coverage:
    name: Coverage gate (>=90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --exclude-group benchmark --exclude-group integration
      - name: Enforce coverage gate
        run: php bin/check-coverage.php coverage.xml 90

  integration-live:
    name: Integration (live Kafka)
    # Opt-in, not a required check: runs on push to main and on demand, never on pull requests,
    # and is deliberately NOT in ci-green's needs. The unit jobs above exclude the `integration` group.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP (ext-rdkafka)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, rdkafka
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Live Kafka tests
        env:
          BQ_INTEGRATION: "1"
          BQ_KAFKA_BROKERS: localhost:9092
        run: vendor/bin/phpunit --group integration

  conformance:
    name: Conformance suite in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the pinned conformance release script
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          echo "${BQ_FETCH_SH_SHA256}  $RUNNER_TEMP/fetch.sh" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fetch.sh"
      - name: Verify vendored conformance matches the pinned release (checksum-verified)
        run: '"$RUNNER_TEMP/fetch.sh" --check "$BQ_CONFORMANCE_VERSION" tests/conformance'

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [test, static-analysis, coverage, conformance]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
